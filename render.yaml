services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: the-laziz-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://the-laziz-frontend.onrender.com,https://the-laziz.netlify.app,http://localhost:5173
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ── Frontend Static Site ─────────────────────────────────────
  - type: web
    name: the-laziz-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://the-laziz-backend.onrender.com/api
      - key: VITE_WHATSAPP_NUMBER
        value: "917667941496"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
